[workspace]
resolver = "2"
members = [
    "crates/spite-abi",
    "crates/spite-loader",
    "crates/spite-dispatch",
    "crates/spite-cli",
    "crates/spite-server",
    "crates/spite-perplexity",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/giveen/spite"

[workspace.dependencies]
spite-abi      = { path = "crates/spite-abi" }
spite-loader   = { path = "crates/spite-loader" }
spite-dispatch = { path = "crates/spite-dispatch" }

spite-server      = { path = "crates/spite-server" }
spite-perplexity  = { path = "crates/spite-perplexity" }

memmap2     = "0.9"
libloading  = "0.8"
clap        = { version = "4", features = ["derive", "env"] }
thiserror   = "2"
anyhow      = "1"
tokio       = { version = "1", features = ["full"] }
axum        = { version = "0.7", features = ["macros"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tower       = "0.4"
tower-http  = { version = "0.5", features = ["cors", "trace"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
