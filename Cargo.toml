[workspace]
resolver = "2"
members = [
    "crates/spite-abi",
    "crates/spite-loader",
    "crates/spite-dispatch",
    "crates/spite-cli",
    "crates/spite-server",
    "crates/spite-perplexity",
    "crates/spite-tokenizer",
    "crates/spite-sampling",
    "crates/spite-kvcache",
    "crates/spite-speculative",
    "crates/spite-compute",
    "crates/spite-rope",
    "crates/spite-grammar",
    "crates/spite-gpu",
    "crates/spite-models",
    "crates/spite-executor",
    "crates/spite-scheduler",
    "crates/spite-lora",
    "crates/spite-quantize",
    "crates/spite-vision",
]

[workspace.package]
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.97"
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/giveen/spite"

[workspace.dependencies]
spite-abi      = { path = "crates/spite-abi" }
spite-loader   = { path = "crates/spite-loader" }
spite-dispatch = { path = "crates/spite-dispatch" }

spite-server      = { path = "crates/spite-server" }
spite-perplexity  = { path = "crates/spite-perplexity" }
spite-tokenizer   = { path = "crates/spite-tokenizer" }
spite-sampling    = { path = "crates/spite-sampling" }
spite-kvcache     = { path = "crates/spite-kvcache" }
spite-speculative = { path = "crates/spite-speculative" }
spite-compute     = { path = "crates/spite-compute" }
spite-rope        = { path = "crates/spite-rope" }
spite-grammar     = { path = "crates/spite-grammar" }
spite-gpu         = { path = "crates/spite-gpu" }
spite-models      = { path = "crates/spite-models" }
spite-executor    = { path = "crates/spite-executor" }
spite-scheduler   = { path = "crates/spite-scheduler" }
spite-lora        = { path = "crates/spite-lora" }
spite-quantize    = { path = "crates/spite-quantize" }
spite-vision      = { path = "crates/spite-vision" }

memmap2     = "0.9"
libloading  = "0.8"
clap        = { version = "4", features = ["derive", "env"] }
thiserror   = "2"
anyhow      = "1"
tokio       = { version = "1", features = ["full"] }
axum        = { version = "0.7", features = ["macros"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tower       = "0.4"
tower-http  = { version = "0.5", features = ["cors", "trace"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
