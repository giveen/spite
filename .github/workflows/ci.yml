name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  # ── Rust: runs on every PR, no GPU needed ──────────────────────────────────
  rust:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # ── CUDA kernels: runs only when NVIDIA kernel files change ───────────────
  kernels-cuda:
    name: CUDA kernel tests (${{ matrix.arch }})
    if: |
      contains(github.event.pull_request.files.*.filename, 'kernels/') &&
      (contains(github.event.pull_request.files.*.filename, '/sm_') ||
       contains(github.event.pull_request.files.*.filename, '/generic/'))
    runs-on: [self-hosted, cuda]

    strategy:
      fail-fast: false
      matrix:
        arch: [sm_89, sm_86, sm_75]

    steps:
      - uses: actions/checkout@v4

      - name: Build kernels
        run: |
          cmake -B build \
            -DSPITE_GPU_ARCHS="${{ matrix.arch }}" \
            -DSPITE_MODELS="llama3,mistral" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Verify kernels
        run: |
          for kernel_dir in build/kernels/llama3/${{ matrix.arch }}/ \
                            build/kernels/mistral/${{ matrix.arch }}/; do
            if [ -d "$kernel_dir" ]; then
              ./target/release/spite verify "$kernel_dir"
            fi
          done

      - name: Benchmark (informational)
        continue-on-error: true
        run: |
          ./target/release/spite benchmark \
            --model "$SPITE_TEST_MODEL" \
            --kernels-dir build/kernels

  # ── AMD HIP kernels: runs only when RDNA kernel files change ──────────────
  kernels-hip:
    name: HIP kernel tests (${{ matrix.arch }})
    if: |
      contains(github.event.pull_request.files.*.filename, 'kernels/') &&
      contains(github.event.pull_request.files.*.filename, '/rdna')
    runs-on: [self-hosted, hip]

    strategy:
      fail-fast: false
      matrix:
        arch: [rdna3, rdna2]

    steps:
      - uses: actions/checkout@v4

      - name: Build kernels
        run: |
          cmake -B build \
            -DSPITE_GPU_ARCHS="${{ matrix.arch }}" \
            -DSPITE_MODELS="llama3" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Verify kernels
        run: ./target/release/spite verify build/kernels/llama3/${{ matrix.arch }}/

  # ── Metal kernels: runs only when Apple Silicon kernel files change ────────
  kernels-metal:
    name: Metal kernel tests
    if: |
      contains(github.event.pull_request.files.*.filename, 'kernels/') &&
      contains(github.event.pull_request.files.*.filename, '/metal/')
    runs-on: [self-hosted, metal]

    steps:
      - uses: actions/checkout@v4

      - name: Build kernels
        run: |
          cmake -B build \
            -DSPITE_GPU_ARCHS="metal" \
            -DSPITE_MODELS="llama3" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify kernels
        run: ./target/release/spite verify build/kernels/llama3/metal/

  # ── Intel Arc kernels ──────────────────────────────────────────────────────
  kernels-arc:
    name: Arc kernel tests
    if: |
      contains(github.event.pull_request.files.*.filename, 'kernels/') &&
      contains(github.event.pull_request.files.*.filename, '/arc_alchemist/')
    runs-on: [self-hosted, arc]

    steps:
      - uses: actions/checkout@v4

      - name: Build kernels
        run: |
          cmake -B build \
            -DSPITE_GPU_ARCHS="arc_alchemist" \
            -DSPITE_MODELS="llama3" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify kernels
        run: ./target/release/spite verify build/kernels/llama3/arc_alchemist/
