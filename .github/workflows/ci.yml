name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  # ── Rust: runs on every PR, no GPU needed ──────────────────────────────────
  rust:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # ── CUDA kernels: runs only when NVIDIA kernel files change ───────────────
  kernels-cuda:
    name: CUDA kernel tests (${{ matrix.arch }})
    if: |
      contains(github.event.pull_request.files.*.filename, 'kernels/') &&
      (contains(github.event.pull_request.files.*.filename, '/sm_') ||
       contains(github.event.pull_request.files.*.filename, '/generic/'))
    runs-on: [self-hosted, cuda]

    strategy:
      fail-fast: false
      matrix:
        arch: [sm_89, sm_86, sm_75]

    steps:
      - uses: actions/checkout@v4

      - name: Build kernels
        run: |
          cmake -B build \
            -DSPITE_GPU_ARCHS="${{ matrix.arch }}" \
            -DSPITE_MODELS="llama/llama3,mistral/mistral4" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Verify kernels
        run: |
          fail=0
          while IFS= read -r so; do
            echo "verifying $so"
            python3 tools/verify/verify.py "$so" || fail=1
          done < <(find build/kernels -type f -name '*.so' -path "*/${{ matrix.arch }}/*")
          exit $fail

      - name: Benchmark (informational)
        continue-on-error: true
        run: |
          cargo build --release -p spite-bench
          ./target/release/spite-bench --model "$SPITE_TEST_MODEL"

  # ── AMD HIP kernels: runs only when RDNA kernel files change ──────────────
  kernels-hip:
    name: HIP kernel tests (${{ matrix.arch }})
    if: |
      contains(github.event.pull_request.files.*.filename, 'kernels/') &&
      contains(github.event.pull_request.files.*.filename, '/rdna')
    runs-on: [self-hosted, hip]

    strategy:
      fail-fast: false
      matrix:
        arch: [rdna3, rdna2]

    steps:
      - uses: actions/checkout@v4

      - name: Build kernels
        run: |
          cmake -B build \
            -DSPITE_GPU_ARCHS="${{ matrix.arch }}" \
            -DSPITE_MODELS="llama/llama3" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Verify kernels
        run: |
          fail=0
          while IFS= read -r so; do
            echo "verifying $so"
            python3 tools/verify/verify.py "$so" || fail=1
          done < <(find build/kernels -type f -name '*.so' -path "*/${{ matrix.arch }}/*")
          exit $fail

  # ── Metal kernels: runs only when Apple Silicon kernel files change ────────
  kernels-metal:
    name: Metal kernel tests
    if: |
      contains(github.event.pull_request.files.*.filename, 'kernels/') &&
      contains(github.event.pull_request.files.*.filename, '/metal/')
    runs-on: [self-hosted, metal]

    steps:
      - uses: actions/checkout@v4

      - name: Build kernels
        run: |
          cmake -B build \
            -DSPITE_GPU_ARCHS="metal" \
            -DSPITE_MODELS="llama/llama3" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify kernels
        run: |
          fail=0
          while IFS= read -r so; do
            echo "verifying $so"
            python3 tools/verify/verify.py "$so" || fail=1
          done < <(find build/kernels -type f \( -name '*.so' -o -name '*.dylib' \) -path "*/metal/*")
          exit $fail

  # ── Intel Arc kernels ──────────────────────────────────────────────────────
  kernels-arc:
    name: Arc kernel tests
    if: |
      contains(github.event.pull_request.files.*.filename, 'kernels/') &&
      contains(github.event.pull_request.files.*.filename, '/arc_alchemist/')
    runs-on: [self-hosted, arc]

    steps:
      - uses: actions/checkout@v4

      - name: Build kernels
        run: |
          cmake -B build \
            -DSPITE_GPU_ARCHS="arc_alchemist" \
            -DSPITE_MODELS="llama/llama3" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify kernels
        run: |
          fail=0
          while IFS= read -r so; do
            echo "verifying $so"
            python3 tools/verify/verify.py "$so" || fail=1
          done < <(find build/kernels -type f -name '*.so' -path "*/arc_alchemist/*")
          exit $fail
